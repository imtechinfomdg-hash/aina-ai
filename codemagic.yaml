workflows:
  aina-android-release:
    name: Aina Android APK Build
    max_build_duration: 120
    environment:
      flutter: stable
    cache:
      cache_paths:
        - assets/models/
    scripts:
      - name: Create assets/models directory
        script: |
          mkdir -p assets/models
          
      - name: Download Llama-3.2-1B GGUF Model from Hugging Face
        script: |
          DEST="assets/models/llama-3.2-1b-instruct-q4_k_m.gguf"
          HF_URL="https://huggingface.co/hugging-quants/Llama-3.2-1B-Instruct-Q4_K_M-GGUF/resolve/main/llama-3.2-1b-instruct-q4_k_m.gguf"
          
          if [ -f "$DEST" ]; then
            echo "Le modèle est déjà présent dans le cache. Skip téléchargement."
          else
            echo "Téléchargement du modèle depuis Hugging Face vers $DEST..."
            
            # Utilisation de wget avec -L pour suivre les redirections de Hugging Face
            wget -L -O ${DEST} "${HF_URL}"
            
            echo "Téléchargement terminé."
          fi
          ls -lh assets/models/
          
      - name: Generate Android folder
        script: |
          flutter create --platforms=android .
          # S'assure que le minSdkVersion est suffisant (24) pour google_mlkit_text_recognition et llama_cpp_dart
          sed -i.bak 's/flutter.minSdkVersion/24/g' android/app/build.gradle || true
          
      - name: Get Flutter packages
        script: |
          flutter pub get
          
      - name: Build Release APK
        script: |
          flutter build apk --release
          
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1
